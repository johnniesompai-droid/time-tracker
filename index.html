    --green-tint: #E4FAEF;
    --yellow: #FFA800;
    --yellow-tint: #FFF3DC;
    --pink: #FF6B9A;
    --pink-tint: #FFEAF1;
    --accent: #FFA800;
    --accent-tint: #FFF3DC;
    --text: #1F2233;
    --text-secondary: #8A8FA3;
    --border: #ECEDF6;
    --danger: #FF5C5C;
    --danger-tint: #FFE8E8;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { padding-bottom: env(safe-area-inset-bottom); }
  button { -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans Thai', sans-serif;
  }
  #app { display: flex; min-height: 100vh; align-items: flex-start; }

  /* ---- sidebar ---- */
  .sidebar { width: 240px; flex-shrink: 0; background: var(--surface); min-height: 100vh; padding: 22px 16px; display: flex; flex-direction: column; box-shadow: 1px 0 0 var(--border); position: sticky; top: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 22px; }
  .logo-box { width: 38px; height: 38px; border-radius: 12px; background: var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand-name { font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 16px; color: var(--text); line-height: 1.2; }
  .brand-sub { font-size: 11px; color: var(--text-secondary); }
  .nav-list { display: flex; flex-direction: column; gap: 4px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 12px; border: none; background: transparent; color: var(--text-secondary); font-family: 'Noto Sans Thai', sans-serif; font-weight: 500; font-size: 14px; cursor: pointer; text-align: left; width: 100%; }

  .sidebar-footer { margin-top: auto; background: var(--primary-tint); border-radius: 16px; padding: 14px; }
  .sidebar-footer-label { font-size: 11px; color: var(--primary-dark); font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
  .sidebar-footer-value { font-family: 'Kanit', sans-serif; font-size: 18px; font-weight: 700; color: var(--primary-dark); }
  .sidebar-footer-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

  /* ---- main / topbar ---- */
  .main { flex: 1; min-width: 0; padding: 22px 26px 50px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  .page-title { font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 22px; color: var(--text); }
  .page-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .live-badge { font-size: 12px; color: var(--primary-dark); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; background: var(--primary-tint); padding: 8px 14px; border-radius: 999px; }
  .live-badge svg { width: 13px; height: 13px; }
  .content { }

  /* ---- generic cards ---- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 18px 20px; box-shadow: 0 6px 20px rgba(108,93,211,0.05); }
  .card-title { font-family: 'Kanit', sans-serif; font-weight: 600; font-size: 15px; margin-bottom: 12px; }

  /* ---- stat cards ---- */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-card { border-radius: 20px; padding: 18px 20px; border: none; }
  .stat-card.highlight { }
  .stat-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .stat-icon { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .stat-icon svg { width: 18px; height: 18px; color: #fff; }
  .stat-trend { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,0.6); }
  .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .stat-label.dark { color: var(--primary-dark); display: flex; align-items: center; gap: 4px; }
  .stat-label svg { width: 14px; height: 14px; }
  .stat-value { font-family: 'Kanit', sans-serif; font-size: 26px; font-weight: 700; color: var(--text); }
  .stat-value.dark { color: var(--primary-dark); }
  .c-purple { background: var(--primary-tint); } .c-purple .stat-icon { background: var(--primary); }
  .c-green { background: var(--green-tint); } .c-green .stat-icon { background: var(--green); }
  .c-yellow { background: var(--yellow-tint); } .c-yellow .stat-icon { background: var(--yellow); }
  .c-pink { background: var(--pink-tint); } .c-pink .stat-icon { background: var(--pink); }

  .empty-note { color: var(--text-secondary); font-size: 14px; padding: 12px 0; }
  table.vp-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.vp-table th { text-align: left; font-family: 'Noto Sans Thai', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: .02em; color: var(--text-secondary); padding: 9px 10px; border-bottom: 1.5px solid var(--border); text-transform: uppercase; }
  table.vp-table td { padding: 12px 10px; border-bottom: 1px solid var(--border); }
  table.vp-table tr:last-child td { border-bottom: none; }
  .table-wrap { overflow-x: auto; }

  .vp-input { font-family: 'Noto Sans Thai', sans-serif; border: 1px solid var(--border); border-radius: 10px; padding: 9px 13px; font-size: 14px; outline: none; background: #fff; color: var(--text); }
  .vp-input:focus { border-color: var(--primary); }
  .vp-btn-primary { background: var(--primary); color: #fff; border: none; border-radius: 12px; padding: 10px 18px; font-family: 'Noto Sans Thai', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 6px 14px rgba(108,93,211,0.3); }
  .vp-btn-primary:hover { background: var(--primary-dark); }
  .vp-btn-primary:disabled { background: var(--border); color: var(--text-secondary); cursor: not-allowed; box-shadow: none; }
  .vp-btn-ghost { background: transparent; border: 1px solid var(--border); border-radius: 12px; padding: 9px 14px; font-family: 'Noto Sans Thai', sans-serif; font-size: 14px; cursor: pointer; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }
  .vp-btn-ghost:hover { background: var(--primary-tint); color: var(--primary-dark); border-color: var(--primary); }
  .vp-btn-ghost.on-surface { background: #fff; }
  .vp-icon-btn { background: transparent; border: none; cursor: pointer; padding: 6px; border-radius: 8px; display: inline-flex; }
  .vp-icon-btn:hover { background: var(--primary-tint); }

  .vp-icon-btn svg, .vp-btn-primary svg, .vp-btn-ghost svg { width: 15px; height: 15px; }
  .vp-range { border: 1px solid var(--border); background: transparent; font-family: 'Noto Sans Thai', sans-serif; font-size: 13px; padding: 7px 15px; border-radius: 999px; cursor: pointer; color: var(--text-secondary); }
  .vp-range.active { background: var(--yellow-tint); color: #A66B00; border-color: var(--yellow); font-weight: 600; }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-row svg { width: 16px; height: 16px; color: var(--text-secondary); }
  .emp-row { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border); border-radius: 14px; padding: 11px 16px; background: var(--bg); }
  .emp-list { display: flex; flex-direction: column; gap: 8px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary-tint); display: flex; align-items: center; justify-content: center; font-family: 'Kanit', sans-serif; font-weight: 600; color: var(--primary-dark); font-size: 14px; flex-shrink: 0; }
  .badge-status { display: inline-flex; align-items: center; gap: 5px; background: var(--yellow-tint); color: #A66B00; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .badge-status.paid { background: var(--green-tint); color: #1D9B5D; padding: 5px 12px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; }
  .dot.big { width: 8px; height: 8px; }
  .dot.idle { background: var(--border); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 15px; border-radius: 999px; font-family: 'Noto Sans Thai', sans-serif; font-size: 14px; cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--text); }
  .chip.selected { border-color: var(--primary); background: var(--primary); color: #fff; font-weight: 600; }
  .chip svg { width: 14px; height: 14px; }
  .active-shift-row { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid var(--primary-tint); border-radius: 14px; padding: 10px 16px; }
  .form-inline { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .loading { min-height: 400px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); }
  .tabular { font-variant-numeric: tabular-nums; }
  .actual-paid-input { width: 100px; }

  /* ---- dashboard grid / widgets ---- */
  .dash-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; margin-bottom: 16px; }
  .col-stack { display: flex; flex-direction: column; gap: 16px; }
  .progress-wrap { display: flex; align-items: center; gap: 16px; }
  .progress-ring-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .progress-num { font-family: 'Kanit', sans-serif; font-size: 26px; font-weight: 700; color: var(--text); }
  .progress-bar-track { width: 100%; height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; margin-top: 10px; }
  .progress-bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--primary), #8677E0); }
  .recent-list { display: flex; flex-direction: column; gap: 10px; }
  .recent-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .recent-item:last-child { border-bottom: none; padding-bottom: 0; }
  .recent-name { font-size: 13px; font-weight: 500; }
  .recent-meta { font-size: 11px; color: var(--text-secondary); }
  .recent-amt { font-size: 13px; font-weight: 700; color: var(--primary-dark); }
  .charts-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  .line-chart-wrap svg { width: 100%; height: 140px; display: block; }
  .top-earner-banner { display: flex; align-items: center; gap: 10px; background: var(--yellow-tint); border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; }
  .top-earner-banner svg { width: 22px; height: 22px; color: #FFA800; flex-shrink: 0; }
  .top-earner-label { font-size: 11px; color: #A66B00; }
  .top-earner-value { font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 15px; color: #7A5A00; }
  .wage-bar-list { display: flex; flex-direction: column; gap: 12px; }
  .wage-bar-row { display: flex; align-items: center; gap: 10px; }
  .wage-bar-name { width: 100px; flex-shrink: 0; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 4px; overflow: hidden; }
  .wage-bar-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wage-bar-row.top .wage-bar-name, .wage-bar-row.top .wage-bar-amt { color: #A66B00; font-weight: 700; }
  .wage-bar-name svg { color: #FFA800; }
  .wage-bar-track { flex: 1; height: 14px; border-radius: 999px; background: var(--border); overflow: hidden; min-width: 40px; }
  .wage-bar-fill { height: 100%; border-radius: 999px; }
  .wage-bar-amt { width: 88px; flex-shrink: 0; text-align: right; font-size: 13px; font-weight: 700; color: var(--text); }
  .donut-wrap { display: flex; align-items: center; gap: 18px; }
  .donut { width: 120px; height: 120px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .donut-center { width: 68px; height: 68px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .donut-center-val { font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 14px; }
  .donut-center-lbl { font-size: 9px; color: var(--text-secondary); }
  .legend { display: flex; flex-direction: column; gap: 8px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-name { color: var(--text); flex: 1; }
  .legend-pct { color: var(--text-secondary); font-weight: 600; }

  /* ---- share / save-as-image ---- */
  .share-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  #slip-capture-holder { position: fixed; left: -9999px; top: 0; }
  .slip { width: 480px; background: #fff; padding: 28px; font-family: 'Noto Sans Thai', sans-serif; color: #1F2233; }
  .slip-header { display: flex; align-items: center; gap: 10px; padding-bottom: 16px; border-bottom: 2px solid #EEEBFB; margin-bottom: 16px; }
  .slip-logo { width: 40px; height: 40px; border-radius: 12px; background: #6C5DD3; display: flex; align-items: center; justify-content: center; }
  .slip-title { font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 17px; }
  .slip-sub { font-size: 12px; color: #8A8FA3; margin-top: 2px; }
  .slip-meta { font-size: 12px; color: #8A8FA3; margin-bottom: 14px; }
  table.slip-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.slip-table th { text-align: left; font-size: 11px; color: #8A8FA3; padding: 6px 4px; border-bottom: 1.5px solid #EEEBFB; }
  table.slip-table td { padding: 9px 4px; border-bottom: 1px solid #F3F3F8; }
  .slip-total-row td { font-weight: 700; border-top: 2px solid #1F2233; border-bottom: none; padding-top: 12px; }
  .slip-footer { margin-top: 18px; padding-top: 14px; border-top: 1px dashed #DADCE8; font-size: 11px; color: #8A8FA3; text-align: center; }
  .slip-status { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; display: inline-block; }
  .slip-status.paid { background: #E4FAEF; color: #1D9B5D; }
  .slip-status.unpaid { background: #FFF3DC; color: #A66B00; }

  @media (max-width: 900px) {
    #app { flex-direction: column; }
    .sidebar { position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: 100%; min-height: 0; z-index: 50; flex-direction: row; align-items: stretch; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 18px rgba(31,34,51,0.08); border-top: 1px solid var(--border); }
    .brand, .sidebar-footer { display: none; }
    .nav-list { flex-direction: row; width: 100%; gap: 4px; }
    .nav-item { flex: 1; flex-direction: column; justify-content: center; gap: 3px; padding: 8px 4px; font-size: 11px; border-radius: 12px; text-align: center; }
    .nav-item svg { width: 20px; height: 20px; }
    .nav-item.active { box-shadow: none; }
    .main { padding: 16px 14px calc(96px + env(safe-area-inset-bottom)); width: 100%; }
    .page-title { font-size: 19px; }
    .dash-grid, .charts-row { grid-template-columns: 1fr; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat-card { padding: 14px; }
    .stat-value { font-size: 20px; }
    .card { padding: 14px; }
    .wage-bar-name { width: 78px; }
    .wage-bar-amt { width: 76px; font-size: 12px; }
    .donut-wrap { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  /* ---------- storage ---------- */
  var STORAGE_EMPLOYEES = "veggie-payroll:employees";
  var STORAGE_ENTRIES = "veggie-payroll:entries";

  function loadJSON(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  }
  function saveJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  /* ---------- state ---------- */
  var state = {
    employees: loadJSON(STORAGE_EMPLOYEES, []),
    entries: loadJSON(STORAGE_ENTRIES, []),
    tab: "dashboard",
    range: "today",
    payFilter: "unpaid",
    payRange: "all",
    manualKnowsEnd: true,
    manualStartEmpIds: [],
    manualBothEmpIds: [],
    editingId: null,
    clockEmpIds: [],
    actualPaidDrafts: {}
  };

  function saveEmployees(list) { state.employees = list; saveJSON(STORAGE_EMPLOYEES, list); render(); }
  function saveEntries(list) { state.entries = list; saveJSON(STORAGE_ENTRIES, list); render(); }

  /* ---------- helpers ---------- */
  function uid(prefix) {
    return prefix + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7);
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function calcHours(timeIn, timeOut) {
    if (!timeIn || !timeOut) return 0;
    var a = timeIn.split(":").map(Number), b = timeOut.split(":").map(Number);
    var diff = (b[0] * 60 + b[1]) - (a[0] * 60 + a[1]);
    if (diff <= 0) diff += 24 * 60;
    return diff / 60;
  }
  function elapsedHours(entry, now) {
    var start = new Date(entry.date + "T" + entry.timeIn + ":00");
    var diffMs = now - start;
    if (diffMs < 0) diffMs = 0;
    return diffMs / 3600000;
  }
  function elapsedFmt(hrs) {
    var totalSec = Math.floor(hrs * 3600);
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    function pad(n) { return String(n).padStart(2, "0"); }
    return pad(h) + ":" + pad(m) + ":" + pad(s);
  }
  function thb(n) {
    return new Intl.NumberFormat("th-TH", { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(n) + " บาท";
  }
  function hrsFmt(n) {
    return new Intl.NumberFormat("th-TH", { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(n) + " ชม.";
  }
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function nowTimeStr() {
    var d = new Date();
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  function thaiDateTime(date) {
    var dateLabel = date.toLocaleDateString("th-TH", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    var timeLabel = date.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    return dateLabel + " · " + timeLabel + " น.";
  }
  function inRange(dateStr, range) {
    if (range === "all") return true;
    var d = new Date(dateStr + "T00:00:00");
    var now = new Date();
    if (range === "today") return dateStr === todayStr();
    if (range === "week") {
      var day = (now.getDay() + 6) % 7;
      var monday = new Date(now);
      monday.setDate(now.getDate() - day);
      monday.setHours(0, 0, 0, 0);
      return d >= monday && d <= now;
    }
    if (range === "month") {
      var first = new Date(now.getFullYear(), now.getMonth(), 1);
      return d >= first && d <= now;
    }
    return true;
  }
  function empMap() {
    var m = {};
    state.employees.forEach(function (e) { m[e.id] = e; });
    return m;
  }
  function icon(name, extra) {
    return '<i data-lucide="' + name + '"' + (extra ? ' ' + extra : '') + '></i>';
  }

  /* ---------- actions ---------- */
  function addEmployee() {
    var nameEl = document.getElementById("new-emp-name");
    var rateEl = document.getElementById("new-emp-rate");
    var name = nameEl.value.trim();
    var rate = parseFloat(rateEl.value);
    if (!name || !rate || rate <= 0) return;
    saveEmployees(state.employees.concat([{ id: uid("emp"), name: name, rate: rate }]));
  }
  function deleteEmployee(id) {
    saveEmployees(state.employees.filter(function (e) { return e.id !== id; }));
  }
  function startEdit(id) { state.editingId = id; render(); }
  function cancelEdit() { state.editingId = null; render(); }
  function confirmEdit(id) {
    var input = document.getElementById("edit-rate-" + id);
    var rate = parseFloat(input.value);
    if (!rate || rate <= 0) return;
    state.editingId = null;
    saveEmployees(state.employees.map(function (e) { return e.id === id ? Object.assign({}, e, { rate: rate }) : e; }));
  }
  function addEntry() {
    var dateEl = document.getElementById("entry-date");
    var inEl = document.getElementById("entry-in");
    if (!dateEl.value || !inEl.value) return;
    var knowsEnd = state.manualKnowsEnd;

    if (knowsEnd) {
      var outEl = document.getElementById("entry-out");
      if (!outEl || !outEl.value) return;
      var bothIds = state.manualBothEmpIds.filter(Boolean);
      if (bothIds.length === 0) return;
      var bothEntries = bothIds.map(function (employeeId) {
        return { id: uid("ent"), employeeId: employeeId, date: dateEl.value, timeIn: inEl.value, timeOut: outEl.value, paid: false };
      });
      state.manualBothEmpIds = [];
      saveEntries(state.entries.concat(bothEntries));
    } else {
      var ids = state.manualStartEmpIds.filter(Boolean);
      if (ids.length === 0) return;
      var newEntries = ids.map(function (employeeId) {
        return { id: uid("ent"), employeeId: employeeId, date: dateEl.value, timeIn: inEl.value, timeOut: "", paid: false };
      });
      state.manualStartEmpIds = [];
      saveEntries(state.entries.concat(newEntries));
    }
  }
  function toggleManualStartEmp(id) {
    var idx = state.manualStartEmpIds.indexOf(id);
    if (idx === -1) state.manualStartEmpIds.push(id); else state.manualStartEmpIds.splice(idx, 1);
    render();
  }
  function toggleManualBothEmp(id) {
    var idx = state.manualBothEmpIds.indexOf(id);
    if (idx === -1) state.manualBothEmpIds.push(id); else state.manualBothEmpIds.splice(idx, 1);
    render();
  }
  function setManualMode(knowsEnd) {
    state.manualKnowsEnd = knowsEnd;
    state.manualStartEmpIds = [];
    state.manualBothEmpIds = [];
    render();
  }
  function deleteEntry(id) {
    saveEntries(state.entries.filter(function (e) { return e.id !== id; }));
  }
  function toggleClockEmp(id) {
    var idx = state.clockEmpIds.indexOf(id);
    if (idx === -1) state.clockEmpIds.push(id); else state.clockEmpIds.splice(idx, 1);
    render();
  }
  function clockIn() {
    var ids = state.clockEmpIds.filter(Boolean);
    if (ids.length === 0) return;
    var t = nowTimeStr(), d = todayStr();
    var newEntries = ids.map(function (employeeId) {
      return { id: uid("ent"), employeeId: employeeId, date: d, timeIn: t, timeOut: "", paid: false };
    });
    state.clockEmpIds = [];
    saveEntries(state.entries.concat(newEntries));
  }
  function clockOut(id) {
    var t = nowTimeStr();
    saveEntries(state.entries.map(function (e) { return e.id === id ? Object.assign({}, e, { timeOut: t }) : e; }));
  }
  function clockOutAll() {
    var t = nowTimeStr();
    saveEntries(state.entries.map(function (e) { return !e.timeOut ? Object.assign({}, e, { timeOut: t }) : e; }));
  }
  function markPaid(id, amount) {
    saveEntries(state.entries.map(function (e) { return e.id === id ? Object.assign({}, e, { paid: true, actualPaid: amount }) : e; }));
  }

  /* ---------- derived ---------- */
  function getSortedEntries() {
    return state.entries.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  }
  function getActiveEntries() { return state.entries.filter(function (e) { return !e.timeOut; }); }
  function getClockableEmployees() {
    var activeIds = {};
    getActiveEntries().forEach(function (e) { activeIds[e.employeeId] = true; });
    return state.employees.filter(function (e) { return !activeIds[e.id]; });
  }
  function getCompletedEntries() { return getSortedEntries().filter(function (e) { return e.timeOut; }); }
  function getPaymentEntries() {
    var completed = getCompletedEntries().filter(function (e) { return inRange(e.date, state.payRange); });
    if (state.payFilter === "unpaid") return completed.filter(function (e) { return !e.paid; });
    if (state.payFilter === "paid") return completed.filter(function (e) { return e.paid; });
    return completed;
  }
  function getUnpaidTotal(em) {
    return getCompletedEntries().filter(function (e) { return !e.paid && inRange(e.date, state.payRange); }).reduce(function (sum, e) {
      var emp = em[e.employeeId];
      var hrs = calcHours(e.timeIn, e.timeOut);
      return sum + (emp ? hrs * emp.rate : 0);
    }, 0);
  }
  function getActualPaidTotal() {
    return getCompletedEntries().filter(function (e) { return e.paid && inRange(e.date, state.payRange); }).reduce(function (sum, e) {
      return sum + (Number(e.actualPaid) || 0);
    }, 0);
  }
  function getDashboardSummary(em, range) {
    var filtered = getSortedEntries().filter(function (e) { return inRange(e.date, range); });
    var byEmp = {}, totalHours = 0, totalWage = 0, shiftCount = 0;
    filtered.forEach(function (e) {
      if (!e.timeOut) return;
      var emp = em[e.employeeId];
      var hrs = calcHours(e.timeIn, e.timeOut);
      var wage = emp ? hrs * emp.rate : 0;
      totalHours += hrs; totalWage += wage; shiftCount += 1;
      if (!byEmp[e.employeeId]) byEmp[e.employeeId] = { name: emp ? emp.name : "พนักงานที่ถูกลบ", hours: 0, wage: 0, shifts: 0 };
      byEmp[e.employeeId].hours += hrs;
      byEmp[e.employeeId].wage += wage;
      byEmp[e.employeeId].shifts += 1;
    });
    var rows = Object.keys(byEmp).map(function (k) { return byEmp[k]; }).sort(function (a, b) { return b.wage - a.wage; });
    return { byEmp: rows, totalHours: totalHours, totalWage: totalWage, shiftCount: shiftCount };
  }

  function getPaymentProgress() {
    var completed = getCompletedEntries();
    var paidCount = completed.filter(function (e) { return e.paid; }).length;
    var pct = completed.length === 0 ? 0 : Math.round((paidCount / completed.length) * 100);
    return { paidCount: paidCount, total: completed.length, pct: pct };
  }

  function getRecentPaid(limit) {
    return getCompletedEntries()
      .filter(function (e) { return e.paid; })
      .sort(function (a, b) {
        var da = a.date + a.timeOut, db = b.date + b.timeOut;
        return da < db ? 1 : da > db ? -1 : 0;
      })
      .slice(0, limit);
  }

  /* ---------- render: dashboard ---------- */
  function renderDashboard() {
    var em = empMap();
    var active = getActiveEntries();
    var summary = getDashboardSummary(em, state.range);
    var progress = getPaymentProgress();
    var recentPaid = getRecentPaid(4);

    var ranges = [["today", "วันนี้"], ["week", "สัปดาห์นี้"], ["month", "เดือนนี้"], ["all", "ทั้งหมด"]];
    var rangeHtml = '<div class="filter-row">' + icon("calendar-range") +
      ranges.map(function (r) {
        return '<button class="vp-range ' + (state.range === r[0] ? "active" : "") + '" data-action="set-range" data-range="' + r[0] + '">' + r[1] + '</button>';
      }).join("") + '</div>';

    var stats = '<div class="stat-grid">' +
      '<div class="stat-card c-purple"><div class="stat-top"><div class="stat-icon">' + icon("clock-3") + '</div></div>' +
      '<div class="stat-label">กะทำงานทั้งหมด</div><div class="stat-value">' + summary.shiftCount + ' กะ</div></div>' +
      '<div class="stat-card c-green"><div class="stat-top"><div class="stat-icon">' + icon("layout-dashboard") + '</div></div>' +
      '<div class="stat-label">ชั่วโมงรวม</div><div class="stat-value">' + hrsFmt(summary.totalHours) + '</div></div>' +
      '<div class="stat-card c-yellow"><div class="stat-top"><div class="stat-icon">' + icon("wallet") + '</div></div>' +
      '<div class="stat-label">ค่าแรงรวม</div><div class="stat-value">' + thb(summary.totalWage) + '</div></div>' +
      '<div class="stat-card c-pink"><div class="stat-top"><div class="stat-icon">' + icon("users") + '</div></div>' +
      '<div class="stat-label">กำลังทำงานตอนนี้</div><div class="stat-value">' + active.length + ' คน</div></div>' +
      '</div>';

    /* ---- left column: active table + summary table ---- */
    var activeCard = '<div class="card">' +
      '<div class="row-between" style="margin-bottom:12px;">' +
      '<div style="display:flex;align-items:center;gap:8px;"><span class="dot big ' + (active.length ? "" : "idle") + '"></span>' +
      '<div class="card-title" style="margin-bottom:0;">กำลังทำงานอยู่ตอนนี้</div></div>' +
      '<span style="font-size:12px;color:var(--text-secondary);">(' + active.length + ' คน)</span>' +
      '</div>';
    if (active.length === 0) {
      activeCard += '<div class="empty-note">ไม่มีพนักงานกำลังทำงานอยู่</div>';
    } else {
      activeCard += '<div class="table-wrap"><table class="vp-table"><thead><tr>' +
        '<th>พนักงาน</th><th>สถานะ</th><th>เวลาเข้างาน</th><th>ทำงานมาแล้ว</th><th>ค่าแรงสะสม</th>' +
        '</tr></thead><tbody>';
      active.forEach(function (entry) {
        var emp = em[entry.employeeId];
        var startISO = entry.date + "T" + entry.timeIn + ":00";
        activeCard += '<tr>' +
          '<td style="font-weight:500;">' + (emp ? esc(emp.name) : "พนักงานถูกลบ") + '</td>' +
          '<td><span class="badge-status paid"><span class="dot"></span> กำลังทำงาน</span></td>' +
          '<td>' + entry.timeIn + ' น.</td>' +
          '<td class="tabular js-elapsed" data-start="' + startISO + '"></td>' +
          '<td style="font-weight:700;color:var(--primary-dark);" class="js-wage" data-start="' + startISO + '" data-rate="' + (emp ? emp.rate : 0) + '"></td>' +
          '</tr>';
      });
      activeCard += '</tbody></table></div>';
    }
    activeCard += '</div>';

    var summaryCard = '<div class="card"><div class="card-title">สรุปตามพนักงาน</div>';
    if (summary.byEmp.length === 0) {
      summaryCard += '<div class="empty-note">ยังไม่มีข้อมูลการทำงานในช่วงนี้</div>';
    } else {
      summaryCard += '<div class="table-wrap"><table class="vp-table"><thead><tr><th>ชื่อพนักงาน</th><th>จำนวนกะ</th><th>ชั่วโมงรวม</th><th>ค่าแรงรวม</th></tr></thead><tbody>';
      summary.byEmp.forEach(function (row) {
        summaryCard += '<tr><td style="font-weight:500;">' + esc(row.name) + '</td><td>' + row.shifts + '</td><td>' + hrsFmt(row.hours) + '</td><td style="font-weight:600;color:var(--primary-dark);">' + thb(row.wage) + '</td></tr>';
      });
      summaryCard += '</tbody></table></div>';
    }
    summaryCard += '</div>';

    /* ---- right column: progress + recent paid ---- */
    var progressCard = '<div class="card">' +
      '<div class="card-title">ความคืบหน้าการจ่ายเงิน</div>' +
      '<div class="progress-ring-label">จ่ายแล้ว ' + progress.paidCount + ' จาก ' + progress.total + ' กะที่เสร็จงาน</div>' +
      '<div class="progress-num">' + progress.pct + '%</div>' +
      '<div class="progress-bar-track"><div class="progress-bar-fill" style="width:' + progress.pct + '%;"></div></div>' +
      '</div>';

    var recentCard = '<div class="card"><div class="card-title">จ่ายเงินล่าสุด</div>';
    if (recentPaid.length === 0) {
      recentCard += '<div class="empty-note">ยังไม่มีรายการจ่ายเงิน</div>';
    } else {
      recentCard += '<div class="recent-list">';
      recentPaid.forEach(function (entry) {
        var emp = em[entry.employeeId];
        recentCard += '<div class="recent-item">' +
          '<div><div class="recent-name">' + (emp ? esc(emp.name) : "พนักงานถูกลบ") + '</div>' +
          '<div class="recent-meta">' + entry.date + ' · ' + entry.timeIn + '-' + entry.timeOut + '</div></div>' +
          '<div class="recent-amt">' + thb(Number(entry.actualPaid) || 0) + '</div>' +
          '</div>';
      });
      recentCard += '</div>';
    }
    recentCard += '</div>';

    var dashGrid = '<div class="dash-grid">' +
      '<div class="col-stack">' + activeCard + summaryCard + '</div>' +
      '<div class="col-stack">' + progressCard + recentCard + '</div>' +
      '</div>';

    /* ---- charts row ---- */
    var rangeLabelText = RANGE_LABELS[state.range] || "ทั้งหมด";
    var barPalette = ["#6C5DD3", "#2ED47A", "#4FD1C5", "#A78BFA", "#5B8DEF", "#34D399", "#818CF8", "#38BDF8"];
    var maxEmpWage = Math.max.apply(null, summary.byEmp.map(function (r) { return r.wage; }).concat([1]));
    var topEarner = summary.byEmp.length > 0 ? summary.byEmp[0] : null;

    var barChartInner;
    if (summary.byEmp.length === 0) {
      barChartInner = '<div class="empty-note">ยังไม่มีข้อมูลค่าแรงในช่วงนี้</div>';
    } else {
      var topBanner = (topEarner && topEarner.wage > 0)
        ? '<div class="top-earner-banner">' + icon("crown") +
          '<div><div class="top-earner-label">ได้ค่าแรงสูงสุด (' + rangeLabelText + ')</div>' +
          '<div class="top-earner-value">' + esc(topEarner.name) + ' · ' + thb(topEarner.wage) + '</div></div></div>'
        : '';
      var barsHtml = summary.byEmp.map(function (row, i) {
        var pct = maxEmpWage > 0 ? Math.max(row.wage > 0 ? 4 : 0, Math.round((row.wage / maxEmpWage) * 100)) : 0;
        var isTop = i === 0 && row.wage > 0;
        var fillStyle = isTop ? "background:linear-gradient(90deg,#FFA800,#FFD166);" : "background:" + barPalette[i % barPalette.length] + ";";
        return '<div class="wage-bar-row ' + (isTop ? "top" : "") + '">' +
          '<div class="wage-bar-name">' + (isTop ? icon("crown", 'style="width:13px;height:13px;flex-shrink:0;"') : '') + '<span>' + esc(row.name) + '</span></div>' +
          '<div class="wage-bar-track"><div class="wage-bar-fill" style="width:' + pct + '%;' + fillStyle + '"></div></div>' +
          '<div class="wage-bar-amt">' + thb(row.wage) + '</div>' +
          '</div>';
      }).join("");
      barChartInner = topBanner + '<div class="wage-bar-list">' + barsHtml + '</div>';
    }
    var wageBarChart = '<div class="card">' +
      '<div class="card-title">ค่าแรงรายคน (' + rangeLabelText + ')</div>' +
      barChartInner +
      '</div>';

    var donutRows = summary.byEmp.slice(0, 4);
    var donutOther = summary.byEmp.slice(4).reduce(function (s, r) { return s + r.wage; }, 0);
    var donutTotal = summary.byEmp.reduce(function (s, r) { return s + r.wage; }, 0);
    var palette = ["#6C5DD3", "#2ED47A", "#FFA800", "#FF6B9A", "#C7CBDD"];
    var donutData = donutRows.map(function (r, i) { return { name: r.name, wage: r.wage, color: palette[i] }; });
    if (donutOther > 0) donutData.push({ name: "อื่น ๆ", wage: donutOther, color: palette[4] });

    var donutHtml;
    if (donutTotal <= 0) {
      donutHtml = '<div class="empty-note">ยังไม่มีข้อมูลค่าแรงในช่วงนี้</div>';
    } else {
      var cum = 0;
      var gradientParts = donutData.map(function (d) {
        var start = (cum / donutTotal) * 100;
        cum += d.wage;
        var end = (cum / donutTotal) * 100;
        return d.color + " " + start.toFixed(1) + "% " + end.toFixed(1) + "%";
      });
      var legendHtml = donutData.map(function (d) {
        var pct = donutTotal > 0 ? Math.round((d.wage / donutTotal) * 100) : 0;
        return '<div class="legend-item"><span class="legend-dot" style="background:' + d.color + ';"></span>' +
          '<span class="legend-name">' + esc(d.name) + '</span><span class="legend-pct">' + pct + '%</span></div>';
      }).join("");
      donutHtml = '<div class="donut-wrap">' +
        '<div class="donut" style="background:conic-gradient(' + gradientParts.join(",") + ');">' +
        '<div class="donut-center"><div class="donut-center-val">' + thb(donutTotal).replace(" บาท", "") + '</div><div class="donut-center-lbl">บาท</div></div>' +
        '</div>' +
        '<div class="legend">' + legendHtml + '</div>' +
        '</div>';
    }
    var donutChart = '<div class="card"><div class="card-title">สัดส่วนค่าแรงตามพนักงาน (' + rangeLabelText + ')</div>' + donutHtml + '</div>';

    var chartsRow = '<div class="charts-row">' + wageBarChart + donutChart + '</div>';

    return rangeHtml + stats + dashGrid + chartsRow;
  }

  /* ---------- render: employees ---------- */
  function renderEmployees() {

          clockCard += '<div class="active-shift-row">' +
            '<div style="font-size:14px;"><span style="font-weight:500;">' + (emp ? esc(emp.name) : "พนักงานถูกลบ") + '</span>' +

            '<button class="vp-btn-ghost" data-action="clock-out" data-id="' + entry.id + '">' + icon("square") + ' เลิกงานตอนนี้</button>' +
            '</div>';
        });
        clockCard += '</div>';
      }
    }
    clockCard += '</div>';

    var manualForm = '<div class="card" style="margin-bottom:16px;">' +
      '<div class="card-title">บันทึกเวลาย้อนหลัง / ด้วยตนเอง</div>';
    if (state.employees.length === 0) {
      manualForm += '<div class="empty-note">กรุณาเพิ่มพนักงานก่อนบันทึกเวลาทำงาน</div>';
    } else {
      var knowsEnd = state.manualKnowsEnd;
      manualForm += '<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">' +
        '<button class="vp-range ' + (knowsEnd ? "active" : "") + '" data-action="set-manual-mode" data-mode="both">เข้างาน + เลิกงานแล้ว</button>' +
        '<button class="vp-range ' + (!knowsEnd ? "active" : "") + '" data-action="set-manual-mode" data-mode="start-only">รู้แค่เวลาเข้างาน (ยังทำงานอยู่)</button>' +
        '</div>';
      manualForm += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px;">' +
        (knowsEnd
          ? 'ใช้ตอนที่พนักงานเข้างานและเลิกงานไปแล้ว เลือกได้หลายคนพร้อมกันถ้าเข้างานและเลิกงานพร้อมกัน ระบุวันที่ เวลาเข้า และเวลาออกย้อนหลังได้ครบ'
          : 'ใช้ตอนที่พนักงานเข้างานไปแล้วแต่ยังไม่เลิกงาน เลือกได้หลายคนพร้อมกันถ้ามาพร้อมกันแล้วลืมบันทึก ระบบจะเริ่มนับเวลาทำงานต่อให้ทันที และไปแสดงในช่อง "กำลังทำงาน" ด้านบน') +
        '</div>';

      if (knowsEnd) {
        manualForm += '<div class="form-inline" style="margin-bottom:12px;">' +
          '<input class="vp-input" type="date" id="entry-date" value="' + todayStr() + '" />' +
          '<input class="vp-input" style="width:110px;" type="time" id="entry-in" value="08:00" lang="th" step="60" />' +
          '<span style="color:var(--text-secondary);">ถึง</span>' +
          '<input class="vp-input" style="width:110px;" type="time" id="entry-out" lang="th" step="60" />' +
          '</div>' +
          '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">เลือกพนักงาน (เลือกได้มากกว่า 1 คน)</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">';
        state.employees.forEach(function (emp) {
          var selectedBoth = state.manualBothEmpIds.indexOf(emp.id) !== -1;
          manualForm += '<button type="button" class="chip ' + (selectedBoth ? "selected" : "") + '" data-action="toggle-manual-both-emp" data-id="' + emp.id + '">' +
            (selectedBoth ? icon("check") : "") + esc(emp.name) + '</button>';
        });
        manualForm += '</div>' +
          '<button class="vp-btn-primary" data-action="add-entry" ' + (state.manualBothEmpIds.length === 0 ? "disabled" : "") + '>' +
          icon("plus") + ' บันทึก' + (state.manualBothEmpIds.length > 0 ? " (" + state.manualBothEmpIds.length + " คน)" : "") + '</button>';
      } else {
        var manualClockable = getClockableEmployees();
        manualForm += '<div class="form-inline" style="margin-bottom:12px;">' +
          '<input class="vp-input" type="date" id="entry-date" value="' + todayStr() + '" />' +
          '<input class="vp-input" style="width:110px;" type="time" id="entry-in" value="08:00" lang="th" step="60" />' +
          '</div>';
        if (manualClockable.length === 0) {
          manualForm += '<div class="empty-note" style="padding:0;">พนักงานทุกคนกำลังทำงานอยู่แล้ว</div>';
        } else {
          manualForm += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">เลือกพนักงานที่เข้างาน (เลือกได้มากกว่า 1 คน)</div>' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">';
          manualClockable.forEach(function (emp) {
            var selected = state.manualStartEmpIds.indexOf(emp.id) !== -1;
            manualForm += '<button type="button" class="chip ' + (selected ? "selected" : "") + '" data-action="toggle-manual-start-emp" data-id="' + emp.id + '">' +
              (selected ? icon("check") : "") + esc(emp.name) + '</button>';
          });
          manualForm += '</div>' +
            '<button class="vp-btn-primary" data-action="add-entry" ' + (state.manualStartEmpIds.length === 0 ? "disabled" : "") + '>' +
            icon("plus") + ' บันทึกเวลาเข้างาน (เริ่มนับเวลาต่อ)' + (state.manualStartEmpIds.length > 0 ? " (" + state.manualStartEmpIds.length + " คน)" : "") + '</button>';
        }
      }
    }
    manualForm += '</div>';

    var sorted = getSortedEntries();
    var history = '<div class="card"><div class="card-title">ประวัติการทำงาน (' + sorted.length + ')</div>';
    if (sorted.length === 0) {
      history += '<div class="empty-note">ยังไม่มีบันทึกเวลาทำงาน</div>';
    } else {
      history += '<div class="table-wrap"><table class="vp-table"><thead><tr>' +
        '<th>วันที่</th><th>พนักงาน</th><th>เข้างาน</th><th>ออกงาน</th><th>ชั่วโมง</th><th>ค่าแรง</th><th></th>' +
        '</tr></thead><tbody>';
      sorted.forEach(function (entry) {
        var emp = em[entry.employeeId];
        var active2 = !entry.timeOut;
        var hrs = calcHours(entry.timeIn, entry.timeOut);
        var wage = emp && !active2 ? hrs * emp.rate : 0;
        history += '<tr>' +
          '<td>' + entry.date + '</td>' +
          '<td>' + (emp ? esc(emp.name) : '<span style="color:var(--text-secondary);">พนักงานถูกลบ</span>') + '</td>' +
          '<td>' + entry.timeIn + '</td>' +
          '<td>' + (active2 ? '<span class="badge-status">กำลังทำงาน</span>' : entry.timeOut) + '</td>' +
          '<td>' + (active2 ? "-" : hrsFmt(hrs)) + '</td>' +
          '<td style="font-weight:600;color:var(--primary-dark);">' + (active2 ? "-" : thb(wage)) + '</td>' +
          '<td><button class="vp-icon-btn danger" data-action="delete-entry" data-id="' + entry.id + '">' + icon("trash-2", 'style="color:var(--danger)"') + '</button></td>' +
          '</tr>';
      });
      history += '</tbody></table></div>';
    }
    history += '</div>';

    return clockCard + manualForm + history;
  }

  /* ---------- render: payment ---------- */
  function renderPayment() {
    var em = empMap();
    var unpaidTotal = getUnpaidTotal(em);
    var actualPaidTotal = getActualPaidTotal();
    var payEntries = getPaymentEntries();

    var ranges = [["today", "วันนี้"], ["week", "สัปดาห์นี้"], ["month", "เดือนนี้"], ["all", "ทั้งหมด"]];
    var rangeHtml = '<div class="filter-row">' + icon("calendar-range") +
      ranges.map(function (r) {
        return '<button class="vp-range ' + (state.payRange === r[0] ? "active" : "") + '" data-action="set-pay-range" data-range="' + r[0] + '">' + r[1] + '</button>';
      }).join("") + '</div>';

    var filters = [["unpaid", "ยังไม่จ่าย"], ["paid", "จ่ายแล้ว"], ["all", "ทั้งหมด"]];
    var top = '<div class="row-between" style="margin-bottom:16px;">' +
      '<div style="display:flex;gap:6px;">' +
      filters.map(function (f) {
        return '<button class="vp-range ' + (state.payFilter === f[0] ? "active" : "") + '" data-action="set-pay-filter" data-filter="' + f[0] + '">' + f[1] + '</button>';
      }).join("") + '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
      '<div style="background:var(--accent-tint);color:#7A5A0C;font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;">ยอดค้างจ่ายรวม ' + thb(unpaidTotal) + '</div>' +
      '<div style="background:var(--primary-tint);color:var(--primary-dark);font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;">จ่ายเงินจริงรวม ' + thb(actualPaidTotal) + '</div>' +
      '</div></div>';

    var shareRow = '<div class="share-btns" style="margin-bottom:14px;">' +
      '<button class="vp-btn-ghost" data-action="save-slip-image" id="save-slip-btn">' + icon("image") + ' บันทึกเป็นรูปภาพ</button>' +
      '<button class="vp-btn-primary" data-action="share-slip-image" id="share-slip-btn">' + icon("share-2") + ' แชร์รูปภาพ</button>' +
      '</div>';

    var card = '<div class="card"><div class="card-title">รายการจ่ายเงิน (' + payEntries.length + ')</div>';
    if (payEntries.length === 0) {
      card += '<div class="empty-note">ไม่มีรายการในหมวดนี้</div>';
    } else {
      card += '<div class="table-wrap"><table class="vp-table"><thead><tr>' +
        '<th>วันที่</th><th>ชื่อพนักงาน</th><th>เวลาเข้างาน</th><th>เวลาออกงาน</th><th>เวลาทำงานทั้งหมด</th><th>ค่าแรง</th><th>จ่ายเงินจริง</th><th></th>' +
        '</tr></thead><tbody>';
      payEntries.forEach(function (entry) {
        var emp = em[entry.employeeId];
        var hrs = calcHours(entry.timeIn, entry.timeOut);
        var wage = emp ? hrs * emp.rate : 0;
        var draft = state.actualPaidDrafts[entry.id];
        var actualValue = draft !== undefined ? draft :
          (entry.actualPaid !== undefined && entry.actualPaid !== null && entry.actualPaid !== "" ? entry.actualPaid : Math.round(wage));
        card += '<tr>' +
          '<td>' + entry.date + '</td>' +
          '<td style="font-weight:500;">' + (emp ? esc(emp.name) : '<span style="color:var(--text-secondary);">พนักงานถูกลบ</span>') + '</td>' +
          '<td>' + entry.timeIn + '</td>' +
          '<td>' + entry.timeOut + '</td>' +
          '<td>' + hrsFmt(hrs) + '</td>' +
          '<td style="font-weight:600;color:var(--primary-dark);">' + thb(wage) + '</td>' +
          '<td><input class="vp-input actual-paid-input" type="number" step="1" min="0" ' + (entry.paid ? "disabled" : "") +
          ' data-role="actual-paid-input" data-id="' + entry.id + '" value="' + actualValue + '" /></td>' +
          '<td>' + (entry.paid ?
            '<span class="badge-status paid">' + icon("check") + ' จ่ายเงินแล้ว</span>' :
            '<button class="vp-btn-primary" data-action="mark-paid" data-id="' + entry.id + '">' + icon("wallet") + ' จ่ายเงิน</button>') +
          '</td></tr>';
      });
      card += '</tbody></table></div>';
    }
    card += '</div>';

    return rangeHtml + top + shareRow + card;
  }

  /* ---------- share as image ---------- */
  var RANGE_LABELS = { today: "วันนี้", week: "สัปดาห์นี้", month: "เดือนนี้", all: "ทั้งหมด" };
  var PAYFILTER_LABELS = { unpaid: "ยังไม่จ่าย", paid: "จ่ายแล้ว", all: "ทั้งหมด" };

  function buildSlipHtml() {
    var em = empMap();
    var payEntries = getPaymentEntries();
    var now = new Date();
    var grandTotal = 0;

    var rows = payEntries.map(function (entry) {
      var emp = em[entry.employeeId];
      var hrs = calcHours(entry.timeIn, entry.timeOut);
      var wage = emp ? hrs * emp.rate : 0;
      var amount = entry.paid ? (Number(entry.actualPaid) || 0) : Math.round(wage);
      grandTotal += amount;
      return '<tr>' +
        '<td>' + (emp ? esc(emp.name) : "พนักงานถูกลบ") + '<br/><span style="color:#8A8FA3;font-size:11px;">' + entry.date + '</span></td>' +
        '<td>' + entry.timeIn + ' - ' + entry.timeOut + '<br/><span style="color:#8A8FA3;font-size:11px;">' + hrsFmt(hrs) + '</span></td>' +
        '<td style="text-align:right;font-weight:700;">' + thb(amount) + '</td>' +
        '<td style="text-align:center;"><span class="slip-status ' + (entry.paid ? "paid" : "unpaid") + '">' + (entry.paid ? "จ่ายแล้ว" : "รอจ่าย") + '</span></td>' +
        '</tr>';
    }).join("");

    if (payEntries.length === 0) {
      rows = '<tr><td colspan="4" style="text-align:center;color:#8A8FA3;padding:20px 0;">ไม่มีรายการในหมวดนี้</td></tr>';
    }

    return '<div class="slip">' +
      '<div class="slip-header">' +
      '<div class="slip-logo">' + icon("sprout", 'style="color:#fff;width:20px;height:20px;"') + '</div>' +
      '<div><div class="slip-title">ใบสรุปจ่ายค่าแรง แผนกคัดผัก</div><div class="slip-sub">สร้างเมื่อ ' + thaiDateTime(now) + '</div></div>' +
      '</div>' +
      '<div class="slip-meta">ช่วงวันที่: ' + (RANGE_LABELS[state.payRange] || "ทั้งหมด") + ' &nbsp;·&nbsp; สถานะ: ' + (PAYFILTER_LABELS[state.payFilter] || "ทั้งหมด") + ' &nbsp;·&nbsp; ' + payEntries.length + ' รายการ</div>' +
      '<table class="slip-table"><thead><tr><th>พนักงาน</th><th>เวลาทำงาน</th><th style="text-align:right;">ยอดเงิน</th><th style="text-align:center;">สถานะ</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
      (payEntries.length > 0 ? '<tfoot><tr class="slip-total-row"><td colspan="2">รวมทั้งหมด</td><td style="text-align:right;">' + thb(grandTotal) + '</td><td></td></tr></tfoot>' : '') +
      '</table>' +
      '<div class="slip-footer">สร้างจากระบบคิดค่าแรง แผนกคัดผัก</div>' +
      '</div>';
  }

  function renderSlipToCanvas(callback) {
    var holder = document.createElement("div");
    holder.id = "slip-capture-holder";
    holder.innerHTML = buildSlipHtml();
    document.body.appendChild(holder);
    if (window.lucide) lucide.createIcons();
    if (!window.html2canvas) {
      document.body.removeChild(holder);
      alert("ไม่สามารถโหลดตัวสร้างรูปภาพได้ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่");
      return;
    }
    html2canvas(holder.querySelector(".slip"), { scale: 2, backgroundColor: "#ffffff" }).then(function (canvas) {
      document.body.removeChild(holder);
      callback(canvas);
    }).catch(function () {
      document.body.removeChild(holder);
      alert("สร้างรูปภาพไม่สำเร็จ ลองใหม่อีกครั้ง");
    });
  }

  function saveSlipImage() {
    renderSlipToCanvas(function (canvas) {
      var link = document.createElement("a");
      link.download = "สรุปจ่ายค่าแรง-" + todayStr() + ".png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });
  }

  function shareSlipImage() {
    renderSlipToCanvas(function (canvas) {
      canvas.toBlob(function (blob) {
        if (!blob) { alert("สร้างรูปภาพไม่สำเร็จ ลองใหม่อีกครั้ง"); return; }
        var file = new File([blob], "สรุปจ่ายค่าแรง-" + todayStr() + ".png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({
            files: [file],
            title: "สรุปจ่ายค่าแรง แผนกคัดผัก",
            text: "สรุปจ่ายค่าแรง " + todayStr()
          }).catch(function () {});
        } else {
          var link = document.createElement("a");
          link.download = file.name;
          link.href = canvas.toDataURL("image/png");
          link.click();
          alert("อุปกรณ์นี้แชร์รูปภาพโดยตรงไม่ได้ ระบบได้บันทึกรูปภาพลงเครื่องให้แทน สามารถแนบไฟล์นี้ส่งผ่าน Line หรือ Facebook ได้เลย");
        }
      }, "image/png");
    });
  }

  /* ---------- full render ---------- */
  function render() {
    var now = new Date();
    var tabs = [
      ["dashboard", "layout-dashboard", "แดชบอร์ด"],
      ["employees", "users", "พนักงาน"],
      ["entries", "clock-3", "บันทึกเวลา"],
      ["payment", "wallet", "จ่ายเงิน"]
    ];
    var titles = {
      dashboard: ["แดชบอร์ด", "ภาพรวมการทำงานและค่าแรงของทีมคัดผัก"],
      employees: ["พนักงาน", "จัดการรายชื่อและค่าแรงต่อชั่วโมง"],
      entries: ["บันทึกเวลา", "เริ่มงาน เลิกงาน และบันทึกเวลาย้อนหลัง"],
      payment: ["จ่ายเงิน", "ตรวจสอบและบันทึกการจ่ายค่าแรง"]
    };

    var em = empMap();
    var todaySummary = getDashboardSummary(em, "today");

    var sidebar = '<aside class="sidebar">' +
      '<div class="brand">' +
      '<div class="logo-box">' + icon("sprout", 'style="color:#fff;width:20px;height:20px;"') + '</div>' +
      '<div><div class="brand-name">คัดผัก</div><div class="brand-sub">ระบบคิดค่าแรง</div></div>' +
      '</div>' +
      '<nav class="nav-list">' +
      tabs.map(function (t) {
        return '<button class="nav-item ' + (state.tab === t[0] ? "active" : "") + '" data-action="set-tab" data-tab="' + t[0] + '">' + icon(t[1]) + '<span>' + t[2] + '</span></button>';
      }).join("") +
      '</nav>' +
      '<div class="sidebar-footer">' +
      '<div class="sidebar-footer-label">' + icon("wallet", 'style="width:12px;height:12px;"') + ' ค่าแรงวันนี้</div>' +
      '<div class="sidebar-footer-value">' + thb(todaySummary.totalWage) + '</div>' +
      '<div class="sidebar-footer-sub">' + todaySummary.shiftCount + ' กะ · ' + hrsFmt(todaySummary.totalHours) + '</div>' +
      '</div>' +
      '</aside>';

    var topbar = '<div class="topbar">' +
      '<div><div class="page-title">' + titles[state.tab][0] + '</div><div class="page-subtitle">' + titles[state.tab][1] + '</div></div>' +
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
      (!isStandalone() ? '<button class="vp-btn-primary" data-action="install-app">' + icon("download") + ' ติดตั้งแอป</button>' : '') +
      '<div class="live-badge">' + icon("clock-3") + ' <span id="live-clock-header">' + thaiDateTime(now) + '</span></div>' +
      '</div></div>';

    var body;
    if (state.tab === "dashboard") body = renderDashboard();
    else if (state.tab === "employees") body = renderEmployees();
    else if (state.tab === "entries") body = renderEntries();
    else body = renderPayment();

    document.getElementById("app").innerHTML = sidebar + '<main class="main">' + topbar + '<div class="content">' + body + '</div></main>';


    var elClock = document.getElementById("live-clock-entries");
    if (elClock) elClock.textContent = thaiDateTime(now);

    if (window.lucide) lucide.createIcons();
  }

  /* ---------- live ticking (no full re-render, avoids disrupting inputs) ---------- */
  function tickLive() {
    var now = new Date();
    var headerClock = document.getElementById("live-clock-header");
    if (headerClock) headerClock.textContent = thaiDateTime(now);
    var entriesClock = document.getElementById("live-clock-entries");
    if (entriesClock) entriesClock.textContent = thaiDateTime(now);

    document.querySelectorAll(".js-elapsed").forEach(function (el) {
      var start = new Date(el.getAttribute("data-start"));
      var hrs = Math.max(0, (now - start) / 3600000);
      el.textContent = elapsedFmt(hrs);
    });
    document.querySelectorAll(".js-wage").forEach(function (el) {
      var start = new Date(el.getAttribute("data-start"));
      var rate = parseFloat(el.getAttribute("data-rate")) || 0;
      var hrs = Math.max(0, (now - start) / 3600000);
      el.textContent = thb(hrs * rate);
    });
  }
  setInterval(tickLive, 1000);

  /* ---------- event delegation ---------- */
  document.getElementById("app").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var action = btn.getAttribute("data-action");
    var id = btn.getAttribute("data-id");
    switch (action) {
      case "set-tab": state.tab = btn.getAttribute("data-tab"); render(); break;
      case "set-range": state.range = btn.getAttribute("data-range"); render(); break;
      case "set-pay-filter": state.payFilter = btn.getAttribute("data-filter"); render(); break;
      case "set-pay-range": state.payRange = btn.getAttribute("data-range"); render(); break;
      case "add-employee": addEmployee(); break;
      case "delete-employee": deleteEmployee(id); break;
      case "edit-employee": startEdit(id); break;
      case "confirm-edit": confirmEdit(id); break;
      case "cancel-edit": cancelEdit(); break;
      case "add-entry": addEntry(); break;
      case "set-manual-mode": setManualMode(btn.getAttribute("data-mode") === "both"); break;
      case "delete-entry": deleteEntry(id); break;
      case "toggle-clock-emp": toggleClockEmp(id); break;
      case "toggle-manual-start-emp": toggleManualStartEmp(id); break;
      case "toggle-manual-both-emp": toggleManualBothEmp(id); break;
      case "clock-in": clockIn(); break;
      case "clock-out": clockOut(id); break;
      case "clock-out-all": clockOutAll(); break;
      case "mark-paid":
        var input = document.querySelector('[data-role="actual-paid-input"][data-id="' + id + '"]');
        var val = input ? parseFloat(input.value) : NaN;
        if (isNaN(val)) {
          var em = empMap();
          var entry = state.entries.filter(function (x) { return x.id === id; })[0];
          var emp = entry ? em[entry.employeeId] : null;
          var hrs = entry ? calcHours(entry.timeIn, entry.timeOut) : 0;
          val = Math.round(emp ? hrs * emp.rate : 0);
        }
        markPaid(id, val);
        break;
      case "install-app": installApp(); break;
      case "save-slip-image": saveSlipImage(); break;
      case "share-slip-image": shareSlipImage(); break;
    }
  });

  document.getElementById("app").addEventListener("input", function (e) {
    var el = e.target;
    if (el.getAttribute && el.getAttribute("data-role") === "actual-paid-input") {
      var id = el.getAttribute("data-id");
      var v = el.value === "" ? "" : parseFloat(el.value);
      state.actualPaidDrafts[id] = v;
    }
  });

  /* ---------- PWA: ปุ่มติดตั้งแอป ---------- */
  var deferredInstallPrompt = null;
  function isStandalone() {
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  }
  function isIOS() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstallPrompt = e;
    render();
  });
  window.addEventListener("appinstalled", function () {
    deferredInstallPrompt = null;
    render();
  });
  function installApp() {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.then(function () { deferredInstallPrompt = null; render(); });
    } else if (isIOS()) {
      alert("วิธีติดตั้งบน iPhone/iPad:\n1) เปิดหน้านี้ด้วย Safari\n2) กดปุ่มแชร์ (ไอคอนสี่เหลี่ยมมีลูกศรขึ้น)\n3) เลือก \"เพิ่มไปยังหน้าจอโฮม\"\n4) กด \"เพิ่ม\"");
    } else {
      alert("วิธีติดตั้ง: กดเมนู ⋮ ของเบราว์เซอร์ แล้วเลือก \"ติดตั้งแอป\" หรือ \"เพิ่มไปยังหน้าจอหลัก\"");
    }
  }

  /* ---------- PWA: service worker (ใช้ได้เมื่อเปิดผ่าน https หรือ localhost) ---------- */
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }

  /* ---------- init ---------- */
  render();
})();
</script>
</body>
</html>
